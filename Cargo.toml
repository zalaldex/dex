[package]
name = "telegram-bot-rs"
version = "1.0.0"
edition = "2021"

[[bin]]
name = "telegram_bot"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
teloxide = { version = "0.27", features = ["macros"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite"] }
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
env_logger = "0.11"
dotenv = "0.15"
anyhow = "1.0"
thiserror = "1.0"
futures = "0.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
